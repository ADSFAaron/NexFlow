# Robolectric defaults for every test in app/src/test.
#
# sdk: Robolectric 4.16.x ships images up to API 36, but compileSdk is 37 — left to its own
# devices Robolectric targets compileSdk and dies with "Unsupported Android SDK level 37".
# 36 is the newest it can actually run, which is also the closest thing to the platform the
# app is compiled against. Pin a lower level per-test with @Config(sdk = [30]) when a test is
# about minSdk behaviour specifically.
sdk=36

# The manifest declares .NexFlowApplication, which is @HiltAndroidApp — instantiating it would
# spin up the whole DI graph for tests that only render a composable. Plain Application is the
# right default here. A Robolectric test that genuinely wants injection should opt back in with
# @Config(application = HiltTestApplication::class) and carry the Hilt test deps itself.
application=android.app.Application
