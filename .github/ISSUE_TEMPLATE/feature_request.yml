name: ✨ 功能建議 / Feature request
description: 提議新的觸發條件、動作，或既有功能的改進
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        歡迎提案！如果你打算自己實作，**請先開這個 issue 討論再動手**，避免方向不合白做工。
        實作方式請看 [CONTRIBUTING.md](https://github.com/ADSFAaron/NexFlow/blob/master/CONTRIBUTING.md)。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提案前確認
      options:
        - label: 我已經搜尋過既有的 issue，沒有重複的提案
          required: true
        - label: 我看過 README 的功能總覽，確認現有的觸發／動作組不出這件事
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: 這是哪一類提案
      options:
        - 新的觸發條件（Trigger）
        - 新的動作（Action）
        - 既有功能的改進
        - UI／使用體驗
        - 匯入相容性（MacroDroid .mdr 等）
        - 翻譯／在地化
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解決什麼問題
      description: 請描述使用情境，而不只是功能名稱——知道你想達成什麼，才可能找到更好的做法
      placeholder: |
        我想在連上車機藍牙時自動開啟導航 App 並把音量調到最大，
        但目前藍牙觸發沒辦法指定特定裝置。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎麼運作
      description: 需要哪些設定欄位？觸發時機是什麼？失敗時應該怎麼處理？
    validations:
      required: true

  - type: textarea
    id: permissions
    attributes:
      label: 需要什麼權限或系統能力（如果知道的話）
      description: |
        例如：無障礙服務、通知存取、`WRITE_SECURE_SETTINGS`、root。
        ℹ️ 需要 root 或額外框架（Xposed / Magisk）的功能目前不在專案範圍內。

  - type: textarea
    id: alternatives
    attributes:
      label: 有沒有替代做法
      description: 現在你怎麼繞過這個問題？其他 App（MacroDroid / Tasker）是怎麼做的？

  - type: dropdown
    id: contribute
    attributes:
      label: 你願意自己實作嗎
      options:
        - 願意，需要一點指引
        - 願意，我可以獨立完成
        - 不行，只是提案
    validations:
      required: true
