name: CI

# Pull request 的品質閘門：跑兩個 flavor 的單元測試。
# master 的 push 由 release.yml 負責（它也會跑同一組測試），所以這裡不重複掛 push，
# 避免每次 push 都跑兩份一樣的測試。
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read # 只需要讀 code，不碰 tag / release

concurrency:
  # 同一個 PR 連續 push 時，取消還在跑的舊 job
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 單元測試
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # compileSdk 37 對應的套件 id 是 android-37.0（從 API 36.1 起改用 <major>.<minor> 命名）。
          # 這裡不裝 NDK：debugSymbolLevel = "FULL" 只在 release buildType 生效，
          # debug 單元測試用不到，省下一大包下載。
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core module 測試
        run: >
          ./gradlew
          :core:automation:test
          :core:flow-schema:test
          :core:macrodroid-compat:test

      - name: App 單元測試（github flavor）
        run: ./gradlew :app:testGithubDebugUnitTest

      # play flavor 移除了簡訊／撥號／模擬點擊的程式碼（app/src/play 對 app/src/github）。
      # 動到 app/src/main 的共用程式碼很容易只顧到 github 版，這一步就是要抓那個。
      - name: App 單元測試（play flavor）
        run: ./gradlew :app:testPlayDebugUnitTest

      # Renders the @PreviewTest composables in app/src/screenshotTest and diffs them against
      # the PNGs in app/src/screenshotTestGithubDebug/reference. Layoutlib renders off-device,
      # so this needs no emulator and belongs in the fast job. Reference images are only kept
      # for the github flavor — nothing previewed here is flavor-specific.
      # Regenerate after an intentional UI change: ./gradlew :app:updateGithubDebugScreenshotTest
      - name: Compose 截圖測試（4 語系 × 深淺色）
        run: ./gradlew :app:validateGithubDebugScreenshotTest

      - name: 上傳測試報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/screenshotTest/**
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # checkDependencies = true means this also lints :core:*, which have no lint step of
      # their own. Pre-existing findings live in app/lint-baseline.xml; anything new fails.
      # Both flavors, for the same reason the unit tests run twice — src/play and src/github
      # are different code.
      - name: Lint（兩個 flavor）
        run: ./gradlew :app:lintGithubDebug :app:lintPlayDebug

      - name: 上傳 lint 報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: 'app/build/reports/lint-results-*.html'
          retention-days: 7

  instrumented-tests:
    name: Instrumented 測試（API 30 模擬器）
    runs-on: ubuntu-latest
    # The emulator boot plus install/run is the slowest thing here; the unit-test job is the
    # fast signal, so this one is allowed to take its time rather than blocking it.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # Gradle Managed Devices boot a real emulator, which needs hardware acceleration. Without
      # this the runner's /dev/kvm is root-only and the emulator falls back to software
      # emulation — slow enough that the tests time out rather than fail honestly.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The aosp-atd system image itself is downloaded by the managed-device task.
          packages: 'platforms;android-37.0 build-tools;37.0.0 emulator'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # api30 = the managed device declared in app/build.gradle.kts (Pixel 2, API 30,
      # aosp-atd) — the minSdk floor. swiftshader_indirect because the runner has no GPU.
      # Covers ExecutionBindingsTest (real Hilt graph: every @Binds @IntoSet present) and
      # NexFlowDatabaseMigrationTest (Room migrations against app/schemas).
      - name: androidTest（github flavor, minSdk 30）
        run: >
          ./gradlew :app:api30GithubDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: 上傳 instrumented 測試報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: 'app/build/reports/androidTests/**'
          retention-days: 7
